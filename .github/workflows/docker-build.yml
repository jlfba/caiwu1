# push 到 main 分支时，构建网页版 Docker 镜像并推送到 GitHub Container Registry (ghcr.io)
name: Build & Push Docker Image

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: 核算部/PDF转图片
          file: 核算部/PDF转图片/Dockerfile
          push: true
          tags: |
            ghcr.io/jlfba/caiwu1:latest
            ghcr.io/jlfba/caiwu1:${{ github.sha }}
