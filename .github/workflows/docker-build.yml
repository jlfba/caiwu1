name: Build and Push Docker Image

on:
  push:
    branches: [master, main]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'frontend/**'
      - 'backend/**'
      - 'pdf转图片.py'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/caiwu1:latest
            ghcr.io/${{ github.repository_owner }}/caiwu1:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
